appId: app.rewind.desktop
productName: Rewind
copyright: Rewind

directories:
  output: release
  buildResources: assets

asar: true

# The installer (download) size: maximum uses solid LZMA, which costs build time
# and nothing at runtime. The installed footprint is unaffected.
compression: maximum

# Electron ships ~55 locale .pak files (37 MB installed) and the app is English
# only. Keeping en-US alone drops the rest.
electronLanguages:
  - en-US

# Native modules are already compiled against Electron's ABI by `npm run rebuild`
# (@electron/rebuild). Letting electron-builder rebuild them itself needs Python
# and the full toolchain, and fails outright on a machine without it -- while the
# binaries already in node_modules are the ones the app actually loads.
npmRebuild: false

asarUnpack:
  # Only modules that are genuinely required out of the asar, because they hold
  # .node binaries that cannot be loaded from a virtual filesystem.
  - node_modules/koffi/**
  - node_modules/@koromix/**
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**
  - node_modules/native-sound-mixer/**

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # The two large packages below are shipped by extraResources and located at
  # runtime through process.resourcesPath, never through node_modules -- see
  # resolveFfmpeg and resolveModulePath in obs-bind. They were previously unpacked
  # from the asar as well, which shipped a second copy of each for no reason:
  # about 1042 MB of duplication.
  - '!node_modules/@streamlabs/obs-studio-node/**'
  - '!node_modules/ffmpeg-static/**'

extraResources:
  # The main process resolves these from process.resourcesPath at runtime.
  - from: node_modules/@streamlabs/obs-studio-node
    to: obs-studio-node
    filter:
      - '**/*'
      # Microsoft debug symbols: 311 MB that ships to nobody.
      - '!**/*.pdb'
      # CEF. Rewind has no browser sources, and only obs-browser.dll links
      # libcef -- so dropping obs-browser.dll is what stops a 170 MB browser
      # engine from being loaded into obs64 at all. The rest are its data,
      # locales and ANGLE libraries. ~214 MB installed, measured.
      - '!**/libcef.dll'
      - '!**/chrome_elf.dll'
      - '!**/obs-browser.dll'
      - '!**/obs-browser-page.exe'
      - '!**/icudtl.dat'
      - '!**/resources.pak'
      - '!**/chrome_*.pak'
      - '!**/snapshot_blob.bin'
      - '!**/v8_context_snapshot.bin'
      - '!**/libEGL.dll'
      - '!**/libGLESv2.dll'
      - '!obs-plugins/64bit/locales/**'
      # Modules Rewind never loads. OBS enumerates every plugin in this folder
      # at startup; none of these is reachable from the app's capture, audio,
      # encoder or output paths. Keep win-capture, win-wasapi, obs-nvenc,
      # obs-qsv11, obs-ffmpeg, obs-x264, obs-filters (the mic gain filter),
      # obs-outputs and rtmp-services (the service stub the replay chain uses).
      - '!**/mediasoup-connector.dll'
      - '!**/datachannel.dll'
      - '!**/obs-vst.dll'
      - '!**/win-streamlabs-vst.exe'
      - '!**/Spout.dll'
      - '!**/SpoutDX.dll'
      - '!**/SpoutLibrary.dll'
      - '!**/win-spout.dll'
      - '!**/win-dshow.dll'
      - '!**/obs-ndi.dll'
      - '!**/obs-webrtc.dll'
      - '!**/decklink.dll'
      - '!**/vlc-video.dll'
      - '!**/obs-text.dll'
      - '!**/text-freetype2.dll'
      - '!**/obs-transitions.dll'
      - '!**/motion-transition.dll'
      - '!**/image-source.dll'
      - '!**/coreaudio-encoder.dll'
      - '!**/openvr_api.dll'
      - '!**/win-openvr.dll'
      # Their data directories are dead weight once the DLL is gone.
      - '!data/obs-plugins/coreaudio-encoder/**'
      - '!data/obs-plugins/decklink/**'
      - '!data/obs-plugins/image-source/**'
      - '!data/obs-plugins/motion-transition/**'
      - '!data/obs-plugins/obs-browser/**'
      - '!data/obs-plugins/obs-ndi/**'
      - '!data/obs-plugins/obs-text/**'
      - '!data/obs-plugins/obs-transitions/**'
      - '!data/obs-plugins/obs-vst/**'
      - '!data/obs-plugins/obs-webrtc/**'
      - '!data/obs-plugins/text-freetype2/**'
      - '!data/obs-plugins/vlc-video/**'
      - '!data/obs-plugins/win-dshow/**'
      - '!data/obs-plugins/win-openvr/**'
      - '!data/obs-plugins/win-spout/**'
      - '!data/win-streamlabs-vst/**'
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  - from: assets/favicon.ico
    to: favicon.ico

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
  # Electron's own icon is not an .ico; point the installer at ours.
  icon: assets/favicon.ico
  # TEMPORARY: see the note above `npmRebuild`. Stamping the icon and version
  # metadata into Rewind.exe needs electron-builder's winCodeSign tool, whose
  # archive contains macOS dylib symlinks. Windows refuses to create symlinks
  # without Developer Mode or an elevated shell, and the extraction retries into
  # a fresh directory every time, so packaging never completes there.
  #
  # Turning this off skips that tool entirely. The cost is that Rewind.exe keeps
  # Electron's default icon and no version metadata in Task Manager and Programs
  # and Features. The app's own icons are unaffected: the panel, editor window and
  # tray all take theirs from src/main/icons.ts at runtime.
  #
  # Enabling Developer Mode (Settings > System > For developers) and removing this
  # line restores exe stamping and is the real fix.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Rewind

# Releases live on GitHub, and the updater reads them from here.
#
# This is a target, not a behaviour change: the app still never contacts the
# network on its own. `autoCheckForUpdates` is off in src/main/updater.ts, so a
# check happens only when someone clicks the button in the header. What this
# setting does is tell electron-builder where to publish, and make it emit
# latest.yml, which is the file the updater reads to learn a version exists.
publish:
  provider: github
  owner: bulhaa1
  repo: Rewind
  releaseType: release
